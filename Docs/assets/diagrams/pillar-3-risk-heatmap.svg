<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="Heatmap of five risk types across five steps of the marketing content journey, each cell labelled High, Medium or Low concern">
  <rect width="1200" height="510" fill="#F7F5EF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="17" font-weight="700" fill="#F7F5EF" text-anchor="middle">
      <rect x="300" y="24" width="160" height="40" rx="8" fill="#12203A"/><text x="380" y="50">Brief</text>
      <rect x="468" y="24" width="160" height="40" rx="8" fill="#12203A"/><text x="548" y="50">Generate</text>
      <rect x="636" y="24" width="160" height="40" rx="8" fill="#12203A"/><text x="716" y="50">Review</text>
      <rect x="804" y="24" width="160" height="40" rx="8" fill="#12203A"/><text x="884" y="50">Publish</text>
      <rect x="972" y="24" width="160" height="40" rx="8" fill="#12203A"/><text x="1052" y="50">Measure</text>
    </g>
    <g font-size="17" font-weight="700" fill="#12203A">
      <text x="40" y="107">Biased content or targeting</text>
      <text x="40" y="173">Inaccurate claims</text>
      <text x="40" y="239">Personal data and consent</text>
      <text x="40" y="305">Brand and copyright</text>
      <text x="40" y="371">Over-reliance, skills loss</text>
    </g>
    <g font-size="16" font-weight="700" text-anchor="middle">
      <!-- row 1 -->
      <rect x="300" y="78" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="380" y="113" fill="#12203A">Medium</text>
      <rect x="468" y="78" width="160" height="58" rx="8" fill="#1E3358"/><text x="548" y="113" fill="#FFFFFF">High</text>
      <rect x="636" y="78" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="716" y="113" fill="#12203A">Medium</text>
      <rect x="804" y="78" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="884" y="113" fill="#12203A">Medium</text>
      <rect x="972" y="78" width="160" height="58" rx="8" fill="#DDE5F0"/><text x="1052" y="113" fill="#12203A">Low</text>
      <!-- row 2 -->
      <rect x="300" y="144" width="160" height="58" rx="8" fill="#DDE5F0"/><text x="380" y="179" fill="#12203A">Low</text>
      <rect x="468" y="144" width="160" height="58" rx="8" fill="#1E3358"/><text x="548" y="179" fill="#FFFFFF">High</text>
      <rect x="636" y="144" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="716" y="179" fill="#12203A">Medium</text>
      <rect x="804" y="144" width="160" height="58" rx="8" fill="#1E3358"/><text x="884" y="179" fill="#FFFFFF">High</text>
      <rect x="972" y="144" width="160" height="58" rx="8" fill="#DDE5F0"/><text x="1052" y="179" fill="#12203A">Low</text>
      <!-- row 3 -->
      <rect x="300" y="210" width="160" height="58" rx="8" fill="#1E3358"/><text x="380" y="245" fill="#FFFFFF">High</text>
      <rect x="468" y="210" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="548" y="245" fill="#12203A">Medium</text>
      <rect x="636" y="210" width="160" height="58" rx="8" fill="#DDE5F0"/><text x="716" y="245" fill="#12203A">Low</text>
      <rect x="804" y="210" width="160" height="58" rx="8" fill="#1E3358"/><text x="884" y="245" fill="#FFFFFF">High</text>
      <rect x="972" y="210" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="1052" y="245" fill="#12203A">Medium</text>
      <!-- row 4 -->
      <rect x="300" y="276" width="160" height="58" rx="8" fill="#DDE5F0"/><text x="380" y="311" fill="#12203A">Low</text>
      <rect x="468" y="276" width="160" height="58" rx="8" fill="#1E3358"/><text x="548" y="311" fill="#FFFFFF">High</text>
      <rect x="636" y="276" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="716" y="311" fill="#12203A">Medium</text>
      <rect x="804" y="276" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="884" y="311" fill="#12203A">Medium</text>
      <rect x="972" y="276" width="160" height="58" rx="8" fill="#DDE5F0"/><text x="1052" y="311" fill="#12203A">Low</text>
      <!-- row 5 -->
      <rect x="300" y="342" width="160" height="58" rx="8" fill="#DDE5F0"/><text x="380" y="377" fill="#12203A">Low</text>
      <rect x="468" y="342" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="548" y="377" fill="#12203A">Medium</text>
      <rect x="636" y="342" width="160" height="58" rx="8" fill="#1E3358"/><text x="716" y="377" fill="#FFFFFF">High</text>
      <rect x="804" y="342" width="160" height="58" rx="8" fill="#DDE5F0"/><text x="884" y="377" fill="#12203A">Low</text>
      <rect x="972" y="342" width="160" height="58" rx="8" fill="#7A8FB8"/><text x="1052" y="377" fill="#12203A">Medium</text>
    </g>
    <text x="40" y="448" font-size="16" fill="#4A5568">Level of concern for each risk at each step. Darker means more concern. Ratings are illustrative.</text>
    <text x="40" y="476" font-size="16" fill="#4A5568">Use it to aim controls where they matter, not to apply the same checks everywhere.</text>
  </g>
</svg>

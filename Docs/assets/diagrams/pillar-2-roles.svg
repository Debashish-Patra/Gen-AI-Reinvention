<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Four marketing roles today, what shifts in their work, and the roles they become, with freed capacity redeployed to testing, strategy and customer insight">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A5A0B"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#F7F5EF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="14" font-weight="700" letter-spacing="2" fill="#8A5A0B" text-anchor="middle">
      <text x="190" y="52">ROLES TODAY</text>
      <text x="600" y="52">WHAT SHIFTS</text>
      <text x="1010" y="52">ROLES TOMORROW</text>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <rect x="40" y="76" width="300" height="56" rx="10" fill="#DDE5F0"/><text x="190" y="110" fill="#12203A">Copywriter</text>
      <rect x="40" y="146" width="300" height="56" rx="10" fill="#DDE5F0"/><text x="190" y="180" fill="#12203A">Designer</text>
      <rect x="40" y="216" width="300" height="56" rx="10" fill="#DDE5F0"/><text x="190" y="250" fill="#12203A">Campaign manager</text>
      <rect x="40" y="286" width="300" height="56" rx="10" fill="#DDE5F0"/><text x="190" y="320" fill="#12203A">CRM analyst</text>
    </g>
    <g font-size="16" text-anchor="middle" fill="#12203A">
      <rect x="430" y="76" width="340" height="56" rx="10" fill="#FFFEFA" stroke="#E2DED3" stroke-width="2"/><text x="600" y="110">Writing, then briefing and editing</text>
      <rect x="430" y="146" width="340" height="56" rx="10" fill="#FFFEFA" stroke="#E2DED3" stroke-width="2"/><text x="600" y="180">Making assets, then directing and curating</text>
      <rect x="430" y="216" width="340" height="56" rx="10" fill="#FFFEFA" stroke="#E2DED3" stroke-width="2"/><text x="600" y="250">Running campaigns, then owning experiments</text>
      <rect x="430" y="286" width="340" height="56" rx="10" fill="#FFFEFA" stroke="#E2DED3" stroke-width="2"/><text x="600" y="320">Building segments, then checking them</text>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <rect x="860" y="76" width="300" height="56" rx="10" fill="#1E3358"/><text x="1010" y="110" fill="#FFFFFF">Brand-voice editor</text>
      <rect x="860" y="146" width="300" height="56" rx="10" fill="#1E3358"/><text x="1010" y="180" fill="#FFFFFF">Creative director of AI output</text>
      <rect x="860" y="216" width="300" height="56" rx="10" fill="#1E3358"/><text x="1010" y="250" fill="#FFFFFF">Experiment owner</text>
      <rect x="860" y="286" width="300" height="56" rx="10" fill="#1E3358"/><text x="1010" y="320" fill="#FFFFFF">Segment and data steward</text>
    </g>
    <g stroke="#8A5A0B" stroke-width="3" marker-end="url(#a2)">
      <line x1="344" y1="104" x2="424" y2="104"/><line x1="344" y1="174" x2="424" y2="174"/><line x1="344" y1="244" x2="424" y2="244"/><line x1="344" y1="314" x2="424" y2="314"/>
      <line x1="774" y1="104" x2="854" y2="104"/><line x1="774" y1="174" x2="854" y2="174"/><line x1="774" y1="244" x2="854" y2="244"/><line x1="774" y1="314" x2="854" y2="314"/>
    </g>
    <rect x="40" y="366" width="1120" height="52" rx="12" fill="#D8ECE9" stroke="#1F7A74" stroke-width="2"/>
    <text x="600" y="399" text-anchor="middle" font-size="19" font-weight="700" fill="#12203A">Freed time moves to testing, strategy and customer insight</text>
    <text x="600" y="448" text-anchor="middle" font-size="16" fill="#4A5568">Illustrative marketing roles. The plan covers reskilling and redeployment, not just the shift.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Three-layer stack: digital platforms on top, data and AI in the middle, digital foundations at the base, each with marketing examples">
  <rect width="1200" height="450" fill="#F7F5EF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Layer 1 -->
    <rect x="40" y="26" width="1120" height="110" rx="14" fill="#1E3358"/>
    <text x="64" y="76" font-size="24" font-weight="700" fill="#FFFFFF">Digital platforms</text>
    <text x="64" y="104" font-size="16" fill="#C9D3E3">Where the work happens</text>
    <g font-size="15" font-weight="700" fill="#12203A" text-anchor="middle">
      <rect x="310" y="52" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="405" y="86">Email and CRM</text>
      <rect x="520" y="52" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="615" y="86">Ads</text>
      <rect x="730" y="52" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="825" y="86">App and web</text>
      <rect x="940" y="52" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="1035" y="86">Approval workflow</text>
    </g>
    <!-- Layer 2 -->
    <rect x="40" y="156" width="1120" height="110" rx="14" fill="#E9A23B"/>
    <text x="64" y="206" font-size="24" font-weight="700" fill="#12203A">Data and AI</text>
    <text x="64" y="234" font-size="16" fill="#12203A">What the models know and use</text>
    <g font-size="15" font-weight="700" fill="#12203A" text-anchor="middle">
      <rect x="310" y="182" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="405" y="216">Customer profile</text>
      <rect x="520" y="182" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="615" y="216">Product catalogue</text>
      <rect x="730" y="182" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="825" y="216">Content library</text>
      <rect x="940" y="182" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="1035" y="216">Models, retrieval</text>
    </g>
    <!-- Layer 3 -->
    <rect x="40" y="286" width="1120" height="110" rx="14" fill="#1F7A74"/>
    <text x="64" y="336" font-size="24" font-weight="700" fill="#FFFFFF">Digital foundations</text>
    <text x="64" y="364" font-size="16" fill="#E6F3F1">What everything stands on</text>
    <g font-size="15" font-weight="700" fill="#12203A" text-anchor="middle">
      <rect x="310" y="312" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="405" y="346">Cloud</text>
      <rect x="520" y="312" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="615" y="346">Security, access</text>
      <rect x="730" y="312" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="825" y="346">Integration</text>
      <rect x="940" y="312" width="190" height="58" rx="10" fill="#F7F5EF"/><text x="1035" y="346">Governance</text>
    </g>
    <text x="600" y="430" text-anchor="middle" font-size="17" fill="#4A5568">Each layer carries the one above it. A weak base limits everything on top.</text>
  </g>
</svg>

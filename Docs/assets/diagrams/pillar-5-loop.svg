<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Continuous loop: measure, learn, refresh the portfolio, scale or retire, then measure again">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A5A0B"/></marker>
  </defs>
  <rect width="1200" height="450" fill="#F7F5EF"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#8A5A0B" stroke-width="4" marker-end="url(#a5)">
      <path d="M 736 72 Q 880 72 880 178"/>
      <path d="M 880 252 Q 880 358 736 358"/>
      <path d="M 464 358 Q 320 358 320 252"/>
      <path d="M 320 178 Q 320 72 464 72"/>
    </g>
    <g>
      <rect x="470" y="38" width="260" height="68" rx="12" fill="#1E3358"/>
      <text x="600" y="68" font-size="20" font-weight="700" fill="#FFFFFF">1. Measure</text>
      <text x="600" y="92" font-size="15" fill="#C9D3E3">Results against the baseline</text>

      <rect x="750" y="181" width="260" height="68" rx="12" fill="#1E3358"/>
      <text x="880" y="211" font-size="20" font-weight="700" fill="#FFFFFF">2. Learn</text>
      <text x="880" y="235" font-size="15" fill="#C9D3E3">What worked, what failed</text>

      <rect x="470" y="324" width="260" height="68" rx="12" fill="#1E3358"/>
      <text x="600" y="354" font-size="20" font-weight="700" fill="#FFFFFF">3. Refresh</text>
      <text x="600" y="378" font-size="15" fill="#C9D3E3">Re-score ideas each quarter</text>

      <rect x="190" y="181" width="260" height="68" rx="12" fill="#1E3358"/>
      <text x="320" y="211" font-size="20" font-weight="700" fill="#FFFFFF">4. Scale or retire</text>
      <text x="320" y="235" font-size="15" fill="#C9D3E3">Expand wins, stop weak ones</text>
    </g>
    <text x="600" y="206" font-size="24" font-weight="700" fill="#12203A">Continuous</text>
    <text x="600" y="236" font-size="24" font-weight="700" fill="#12203A">reinvention</text>
    <text x="600" y="432" font-size="17" fill="#4A5568">Pillar 5 keeps the loop turning after launch.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Illustrative bars: AI-assisted work has a lower cost per asset and a shorter cycle time than the control group, both below the agreed target line">
  <rect width="1200" height="410" fill="#F7F5EF"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="38" font-size="18" font-weight="700" fill="#12203A">Lower is better. AI-assisted work must beat the control by the agreed margin.</text>
    <line x1="120" y1="322" x2="1080" y2="322" stroke="#12203A" stroke-width="2"/>
    <!-- group 1 -->
    <rect x="190" y="100" width="120" height="222" rx="6" fill="#7A8FB8"/>
    <rect x="330" y="190" width="120" height="132" rx="6" fill="#E9A23B"/>
    <line x1="150" y1="160" x2="490" y2="160" stroke="#8A5A0B" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="520" y="166" font-size="15" font-weight="700" fill="#8A5A0B">Target</text>
    <text x="250" y="346" font-size="15" fill="#12203A">Control group</text>
    <text x="390" y="346" font-size="15" fill="#12203A">AI-assisted</text>
    <text x="320" y="382" font-size="18" font-weight="700" fill="#12203A">Cost per asset</text>
    <!-- group 2 -->
    <rect x="690" y="120" width="120" height="202" rx="6" fill="#7A8FB8"/>
    <rect x="830" y="210" width="120" height="112" rx="6" fill="#E9A23B"/>
    <line x1="650" y1="180" x2="990" y2="180" stroke="#8A5A0B" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="1020" y="186" font-size="15" font-weight="700" fill="#8A5A0B">Target</text>
    <text x="750" y="346" font-size="15" fill="#12203A">Control group</text>
    <text x="890" y="346" font-size="15" fill="#12203A">AI-assisted</text>
    <text x="820" y="382" font-size="18" font-weight="700" fill="#12203A">Cycle time, brief to launch</text>
    <text x="600" y="402" font-size="14" fill="#4A5568">Illustrative shape, no real data.</text>
  </g>
</svg>

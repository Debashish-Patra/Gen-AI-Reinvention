<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="The pillar-by-phase grid with one column, one row and their shared cell highlighted">
  <rect width="1200" height="670" fill="#F7F5EF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="20" y="20" width="160" height="56" rx="6" fill="#12203A"/>
    <text x="100" y="54" text-anchor="middle" font-size="17" font-weight="700" fill="#F7F5EF">Phase \ Pillar</text>
    <g font-size="17" font-weight="700" fill="#F7F5EF" text-anchor="middle">
      <rect x="190" y="20" width="198" height="56" rx="6" fill="#12203A"/><text x="289" y="54">1 Value</text>
      <rect x="398" y="20" width="198" height="56" rx="6" fill="#12203A"/><text x="497" y="54">2 Talent</text>
      <rect x="606" y="20" width="198" height="56" rx="6" fill="#12203A"/><text x="705" y="54">3 Responsible AI</text>
      <rect x="814" y="20" width="198" height="56" rx="6" fill="#12203A"/><text x="913" y="54">4 Digital core</text>
      <rect x="1022" y="20" width="158" height="56" rx="6" fill="#12203A"/><text x="1101" y="54">5 Change</text>
    </g>
    <g font-size="17" font-weight="700" fill="#12203A" text-anchor="middle">
      <rect x="20" y="86" width="160" height="118" rx="6" fill="#E9A23B"/><text x="100" y="152">1 Frame</text>
      <rect x="20" y="214" width="160" height="118" rx="6" fill="#E9A23B"/><text x="100" y="280">2 Prioritize</text>
      <rect x="20" y="342" width="160" height="118" rx="6" fill="#E9A23B"/><text x="100" y="402">3 Build and</text><text x="100" y="424">pilot</text>
      <rect x="20" y="470" width="160" height="118" rx="6" fill="#E9A23B"/><text x="100" y="530">4 Scale and</text><text x="100" y="552">reinvent</text>
    </g>
    <g font-size="15" fill="#12203A" text-anchor="middle">
      <rect x="190" y="86" width="198" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="289" y="140">Set goal and</text><text x="289" y="162">baselines</text>
      <rect x="398" y="86" width="198" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="497" y="140">Spot affected</text><text x="497" y="162">roles</text>
      <rect x="606" y="86" width="198" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="705" y="140">Note sensitive</text><text x="705" y="162">areas</text>
      <rect x="814" y="86" width="198" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="913" y="140">Find data and</text><text x="913" y="162">tool gaps</text>
      <rect x="1022" y="86" width="158" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="1101" y="140">Name a</text><text x="1101" y="162">sponsor</text>

      <rect x="190" y="214" width="198" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="289" y="268">Score and</text><text x="289" y="290">shortlist</text>
      <rect x="398" y="214" width="198" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="497" y="268">Estimate role</text><text x="497" y="290">impact</text>
      <rect x="606" y="214" width="198" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="705" y="268">First risk</text><text x="705" y="290">screen</text>
      <rect x="814" y="214" width="198" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="913" y="268">Judge</text><text x="913" y="290">readiness</text>
      <rect x="1022" y="214" width="158" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="1101" y="268">Plan who</text><text x="1101" y="290">must adopt</text>

      <rect x="190" y="342" width="198" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="289" y="396">Measure against</text><text x="289" y="418">a control group</text>
      <rect x="398" y="342" width="198" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="497" y="396">Train the</text><text x="497" y="418">pilot team</text>
      <rect x="606" y="342" width="198" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/>
      <rect x="814" y="342" width="198" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="913" y="396">Minimum</text><text x="913" y="418">foundation only</text>
      <rect x="1022" y="342" width="158" height="118" rx="6" fill="#FFFEFA" stroke="#E2DED3"/><text x="1101" y="396">Capture</text><text x="1101" y="418">lessons</text>

      <rect x="190" y="470" width="198" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="289" y="524">Track value</text><text x="289" y="546">realised</text>
      <rect x="398" y="470" width="198" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="497" y="524">Reskill and</text><text x="497" y="546">redeploy</text>
      <rect x="606" y="470" width="198" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="705" y="524">Ongoing</text><text x="705" y="546">monitoring</text>
      <rect x="814" y="470" width="198" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="913" y="524">Extend the</text><text x="913" y="546">platform</text>
      <rect x="1022" y="470" width="158" height="118" rx="6" fill="#F1EEE4" stroke="#E2DED3"/><text x="1101" y="524">Community,</text><text x="1101" y="546">quarterly review</text>
    </g>
  </g>

  <g fill="none">
    <rect x="602" y="16" width="206" height="576" rx="10" stroke="#1F7A74" stroke-width="5"/>
    <rect x="16" y="338" width="1168" height="126" rx="10" stroke="#8A5A0B" stroke-width="5"/>
  </g>
  <rect x="606" y="342" width="198" height="118" rx="6" fill="#E9A23B" fill-opacity="0.45" stroke="#12203A" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12203A" text-anchor="middle">
    <text x="705" y="396">Human review</text><text x="705" y="418">and guardrails</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#12203A">
    <rect x="20" y="624" width="28" height="18" rx="4" fill="none" stroke="#1F7A74" stroke-width="4"/>
    <text x="58" y="639">Column: one pillar (Responsible AI)</text>
    <rect x="400" y="624" width="28" height="18" rx="4" fill="none" stroke="#8A5A0B" stroke-width="4"/>
    <text x="438" y="639">Row: one phase (Build and pilot)</text>
    <rect x="780" y="624" width="28" height="18" rx="4" fill="#E9A23B" fill-opacity="0.45" stroke="#12203A" stroke-width="3"/>
    <text x="818" y="639">Cell: that pillar in that phase</text>
  </g>
</svg>

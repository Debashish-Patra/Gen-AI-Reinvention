<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Before: five unconnected pilots. After: value targets linked to business functions, with reusable use cases and a shared foundation">
  <rect width="1200" height="460" fill="#F7F5EF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- BEFORE -->
    <rect x="20" y="20" width="560" height="420" rx="14" fill="#FFFEFA" stroke="#E2DED3"/>
    <text x="50" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#8A5A0B">BEFORE</text>
    <text x="50" y="92" font-size="26" font-weight="700" fill="#12203A">Scattered pilots</text>
    <g font-size="17" font-weight="700" fill="#12203A" text-anchor="middle">
      <rect x="50" y="140" width="150" height="56" rx="10" fill="#DDE5F0" stroke="#7A8FB8" stroke-dasharray="6 4" stroke-width="2"/><text x="125" y="174">Chatbot</text>
      <rect x="250" y="176" width="150" height="56" rx="10" fill="#DDE5F0" stroke="#7A8FB8" stroke-dasharray="6 4" stroke-width="2"/><text x="325" y="210">Summaries</text>
      <rect x="410" y="128" width="150" height="56" rx="10" fill="#DDE5F0" stroke="#7A8FB8" stroke-dasharray="6 4" stroke-width="2"/><text x="485" y="162">Content</text>
      <rect x="90" y="262" width="150" height="56" rx="10" fill="#DDE5F0" stroke="#7A8FB8" stroke-dasharray="6 4" stroke-width="2"/><text x="165" y="296">Image tool</text>
      <rect x="330" y="276" width="150" height="56" rx="10" fill="#DDE5F0" stroke="#7A8FB8" stroke-dasharray="6 4" stroke-width="2"/><text x="405" y="310">Code helper</text>
    </g>
    <text x="300" y="388" text-anchor="middle" font-size="17" fill="#4A5568">Separate teams. Separate data. No link to the P&amp;L.</text>
    <text x="300" y="414" text-anchor="middle" font-size="17" fill="#4A5568">Each pilot starts from zero.</text>

    <!-- arrow -->
    <polygon points="586,214 614,230 586,246" fill="#E9A23B"/>

    <!-- AFTER -->
    <rect x="620" y="20" width="560" height="420" rx="14" fill="#FFFEFA" stroke="#E2DED3"/>
    <text x="650" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#8A5A0B">AFTER</text>
    <text x="650" y="92" font-size="26" font-weight="700" fill="#12203A">Connected reinvention</text>
    <rect x="650" y="112" width="500" height="44" rx="10" fill="#E9A23B"/>
    <text x="900" y="141" text-anchor="middle" font-size="17" font-weight="700" fill="#12203A">Value targets from the P&amp;L</text>
    <g stroke="#12203A" stroke-width="2.5">
      <line x1="696" y1="156" x2="696" y2="196"/>
      <line x1="798" y1="156" x2="798" y2="196"/>
      <line x1="900" y1="156" x2="900" y2="196"/>
      <line x1="1002" y1="156" x2="1002" y2="196"/>
      <line x1="1104" y1="156" x2="1104" y2="196"/>
    </g>
    <g font-size="15" font-weight="700" fill="#F7F5EF" text-anchor="middle">
      <rect x="650" y="196" width="92" height="56" rx="10" fill="#1E3358"/><text x="696" y="230">Strategy</text>
      <rect x="752" y="196" width="92" height="56" rx="10" fill="#1E3358"/><text x="798" y="230">Marketing</text>
      <rect x="854" y="196" width="92" height="56" rx="10" fill="#1E3358"/><text x="900" y="230">Sales</text>
      <rect x="956" y="196" width="92" height="56" rx="10" fill="#1E3358"/><text x="1002" y="230">Service</text>
      <rect x="1058" y="196" width="92" height="56" rx="10" fill="#1E3358"/><text x="1104" y="230">Ops</text>
    </g>
    <g stroke="#1F7A74" stroke-width="2.5">
      <line x1="696" y1="252" x2="696" y2="276"/>
      <line x1="798" y1="252" x2="798" y2="276"/>
      <line x1="900" y1="252" x2="900" y2="276"/>
      <line x1="1002" y1="252" x2="1002" y2="276"/>
      <line x1="1104" y1="252" x2="1104" y2="276"/>
    </g>
    <rect x="650" y="276" width="500" height="40" rx="10" fill="#D8ECE9" stroke="#1F7A74" stroke-width="2"/>
    <text x="900" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#12203A">Reusable use cases across the chain</text>
    <rect x="650" y="330" width="500" height="48" rx="10" fill="#1F7A74"/>
    <text x="900" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Shared foundation: data, platform, people, governance</text>
    <text x="900" y="414" text-anchor="middle" font-size="17" fill="#4A5568">One plan. Shared data. Every use case tied to value.</text>
  </g>
</svg>
